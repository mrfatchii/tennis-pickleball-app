name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          npx wrangler pages project create courtside-hk --production-branch main || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=courtside-hk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show deployment info
        run: |
          echo "🚀 Deployment completed!"
          echo "📝 Your site should be available at: https://courtside-hk.pages.dev"
